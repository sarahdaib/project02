<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 02: CSS Shapes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="shapes-container">
    <!-- 1. Square -->
    <div class="shape square"></div>

    <!-- 2. Rectangle -->

    <!-- 3. Perfect Circle -->

    <!-- 4. Capsule Pill -->

    <!-- 5. CSS Triangle -->
    <div class="shape triangle"></div>
  </main>

</body>
</html>
